image: oven/bun:alpine

# Change cache directory to be inside the project directory since we can only cache local items.
variables:
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.cache/bun"

cache:
  key:
    files:
      # Cache is tied to the bun.lock, which is the lockfile for the dependencies,
      # hence when the dependencies change, a different cache is used.
      - bun.lock
  paths:
    - .cache/bun

stages:
  - Code Quality
  - Deploy Pages

before_script:
  # For some reason nodejs needs to be installed for all the dependencies to work correctly.
  - apk add nodejs
  # Necessary for "last updated" to be correct.
  - apk add git
  - bun install

types:
  stage: Code Quality
  script:
    - bun run check:types

format:
  stage: Code Quality
  script:
    - bun run check:format

pages:
  stage: Deploy Pages
  script:
    - bun run build
  pages: true
  artifacts:
    paths:
      - public
  only:
    - main
